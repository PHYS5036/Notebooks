name: Build notebook PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "*.ipynb"

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Execute and convert notebooks
        run: |
          mkdir -p pdfs

          for nb in *.ipynb; do
            jupyter nbconvert \
              --to webpdf \
              --output-dir pdfs \
              "$nb"
          done
      - name: Commit PDFs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -f pdfs/*.pdf

          git diff --staged --quiet || \
          git commit -m "Auto-update notebook PDFs"

          git push
