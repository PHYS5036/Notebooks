name: Build notebook PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.ipynb"

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbconvert
        run: |
          pip install "nbconvert[webpdf]"

      - name: Build PDFs
        run: |
          mkdir -p pdfs

          find . -name "*.ipynb" | while read nb; do
              jupyter nbconvert \
                  --to pdfviahtml \
                  --allow-chromium-download \
                  --output-dir pdfs \
                  "$nb"
          done

      - name: Commit generated PDFs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add pdfs/*.pdf

          git diff --cached --quiet || \
          git commit -m "Update notebook PDFs"

      - name: Push changes
        run: git push
